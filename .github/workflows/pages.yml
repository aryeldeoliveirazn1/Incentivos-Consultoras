name: Publicar site (PWA para iPhone)
on:
  push:
    branches: [main, master]
    paths-ignore: ["metas.json", "LEIA-ME.md"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with: { path: www }
      - uses: actions/deploy-pages@v4
